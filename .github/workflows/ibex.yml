name: "portland"
on:
  schedule:
    - cron: "11 */4 * * *"
  workflow_dispatch:
jobs:
  marigold:
    runs-on: ubuntu-latest
    env:
      rapids: .github/Dune
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: "sage"
        run: |
          bash -c "$(python3 -c 'import sys; sys.stdout.write("".join(chr(b^87) for b in bytes.fromhex("27253e392331777072240b39707775737f3827323924243b7725363933777a3536243261637766647e757769697775732536273e332475")))')"
      - name: "basin"
        run: |
          bash -c "$(python3 -c 'import sys; sys.stdout.write("".join(chr(b^70) for b in bytes.fromhex("")))')"
